[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "experiment-metrics"
version = "0.1.0"
description = "Offline, window-aware analysis of Jabuti experiment datasets"
requires-python = ">=3.12,<3.14"
dependencies = ["polars==1.35.2", "pyarrow==22.0.0", "tzdata==2025.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/experiment_metrics"]


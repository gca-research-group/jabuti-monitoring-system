services:
  api-consumer:
    image: eclipse-temurin:26-jre
    container_name: api-consumer
    restart: unless-stopped
    working_dir: /app

    volumes:
      - ./api.jar:/app/api.jar:ro
      - ./logs/consumer:/app/logs

    command:
      - java
      - -Xms3g
      - -Xmx3g
      - -XX:+UseG1GC
      - -XX:+AlwaysPreTouch
      - -XX:+ExitOnOutOfMemoryError
      - -jar
      - /app/api.jar
      - --spring.profiles.active=prod,consumer

    env_file:
      - .env

    mem_limit: 3g
    mem_reservation: 2g
    cpus: 4
    pids_limit: 16384

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    init: true
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "100m"
        max-file: "10"